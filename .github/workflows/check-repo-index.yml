name: Check Repo Index

on:
  pull_request:
  push:
    branches:
      - main
      - ai/repo-index-system

jobs:
  check-repo-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build repository index
        run: python3 scripts/index/build_repo_index.py
      - name: Validate JSON
        run: python3 -m json.tool .ai/code-index.json >/tmp/code-index-check.json
